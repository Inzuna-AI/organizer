name: Deploy

# Bei Push auf main: Lint, Tests, Build und Deploy auf GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # data-repo-template/scripts/notify.mjs muss zum aktuellen Code passen
      - name: notify.mjs aktuell?
        run: |
          npm run build:notify
          git diff --exit-code --ignore-cr-at-eol data-repo-template/scripts/notify.mjs || (echo "Bitte 'npm run build:notify' ausführen und committen." && exit 1)
      - run: npm run build
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
